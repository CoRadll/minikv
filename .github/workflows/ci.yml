name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-windows:
    name: Windows / MSVC / Debug
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # 不写死 -G：runner 镜像的 Visual Studio 版本会变，
      # 让 CMake 自动选择当前机器上最新的 VS 生成器。
      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Debug

      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure
